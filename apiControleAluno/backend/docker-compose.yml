version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: apiControleAluno-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: controle_aluno
      MYSQL_USER: apiuser
      MYSQL_PASSWORD: apipassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apiControleAluno-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=controle_aluno;User=apiuser;Password=apipassword;Port=3306;
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - api-network

volumes:
  mysql_data:

networks:
  api-network:
    driver: bridge